{% extends 'layout/base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex flex-col items-center pt-[100px]">
    <h1 class="text-xl font-bold text-gray-700 mb-6">Nhập điểm học sinh</h1>
    <!-- Danh sách học sinh -->
    <!-- Form Nhập Điểm -->
    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-4xl">
        <div class="grid grid-cols-3 gap-4">
            <!-- Năm học -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Chọn năm học - Học Kỳ</label>
                <select class="academic-year-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Chọn năm học - Học Kỳ</option>
                    {%for hocky in hocky %}
                    <option value="{{hocky.id}}">{{hocky.nam_hoc}} - {{hocky.ten}}</option>
                    {%endfor%}
                   
                </select>
            </div>
            <!-- Môn học -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Môn học:</label>
                <select class="subject-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Chọn môn học</option>
                    {%for monhoc in monhoc %}
                    <option value="{{monhoc.ma_mon}}">{{monhoc.ten}}</option>
                    {%endfor%}
                </select>
            </div>

            <!-- Chọn lớp -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Lớp:</label>
                <select class="class-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Chọn lớp</option>
                    {% for cls in class__ %}
                    <option value="{{ cls.id }}">{{ cls.ten }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Cột Điểm 15P</label>
                <select id="columnSelector15p" class="class-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Số Cột</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Cột điểm 1 tiết</label>
                <select id="columnSelector1t" class="class-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Số Cột</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
        </div>
        <!-- Số cột điểm -->
    </div>
     <!-- Danh sách học sinh -->
     <div class="mt-4 grid bg-white p-6">
        <h2 class="text-lg font-bold text-gray-700 mb-2">Danh Sách Học Sinh:</h2>
        <table class="min-w-full border border-gray-300">
            <thead class="bg-gray-100">
                <tr>
                    <th class="border px-4 py-2">MSSV</th>
                    <th class="border px-4 py-2">Họ và Tên</th>
                    <th class="border px-4 py-2">Điểm 15 phút</th>
                    <th class="border px-4 py-2">Điểm 1 tiết</th>
                    <th class="border px-4 py-2">Điểm Cuối Kỳ</th>
                </tr>
            </thead>
            <tbody class="student-table-body">
                <tr>
                    <td class="border px-4 py-2">20123456</td>
                    <td class="border px-4 py-2">Nguyễn Văn A</td>
                    <td id="inputContainer15p" class="border px-4 py-2 w-[400px]">
                    </td>
                    <td id = "inputContainer1t" class="border px-4 py-2 w-[300px]">
                        <input type="number" step="0.1" value="8.5" class="border rounded px-1 py-0.5 text-sm w-16" />
                        <input type="number" step="0.1" value="8.5" class="border rounded px-1 py-0.5 text-sm w-16" />
                        <input type="number" step="0.1" value="8.5" class="border rounded px-1 py-0.5 text-sm w-16" />
                    </td>
                    <td class="border px-4 py-2">
                        <input type="number" step="0.1" value="8.5" class="border rounded px-1 py-0.5 text-sm w-16" />
                    </td>
                </tr>             
            </tbody>
        </table>
        <div class="mt-4 mx-auto">
            <button class="save-button bg-blue-500 text-white px-4 py-2 rounded-lg">Lưu điểm</button>
        </div>
    </div>
</div>

<script>
    const columnSelector = document.getElementById('columnSelector15p');
    const inputContainer = document.getElementById('inputContainer15p');
    
    columnSelector.addEventListener('change', () => {
        const selectedValue = parseInt(columnSelector.value) || 0;
        // Xóa tất cả các ô nhập trước đó
        inputContainer.innerHTML = '';
        // Tạo các ô nhập mới dựa vào giá trị đã chọn
        for (let i = 0; i < selectedValue; i++) {
            const input = document.createElement('input');
            input.type = 'number';
            input.step = '0.1';
            input.value = '8.5';
            input.className = 'border rounded px-1 py-0.5 text-sm w-16';
            inputContainer.appendChild(input);
        }
    });

    const columnSelector_1tiet = document.getElementById('columnSelector1t');
    const inputContainer_1tiet = document.getElementById('inputContainer1t');

    columnSelector_1tiet.addEventListener('change', () => {
        const selectedValue_1t = parseInt(columnSelector_1tiet.value) || 0;
        // Xóa tất cả các ô nhập trước đó
        inputContainer_1tiet.innerHTML = '';
        // Tạo các ô nhập mới dựa vào giá trị đã chọn
        for (let i = 0; i < selectedValue_1t; i++) {
            const input = document.createElement('input');
            input.type = 'number';
            input.step = '0.1';
            input.value = '8.5';
            input.className = 'border rounded px-1 py-0.5 text-sm w-16';
            inputContainer_1tiet.appendChild(input);
        }
    });
</script>

{% endblock %}
