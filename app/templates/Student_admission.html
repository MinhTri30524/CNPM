{% extends 'layout/base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex flex-col items-center pt-[5px]">
    <!-- Phần tiêu đề -->
    <h1 class="text-[40px] font-bold text-gray-700 mb-6">
        Tiếp Nhận Học Sinh
    </h1>
    <!-- Khung thông tin chính -->
    <div class="grid">
        <!-- Form Thêm Học Sinh -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-[20px] mx-auto">
            <h2 class="font-bold text-gray-700 mb-4">Thông Tin Học Sinh</h2>

            <div class="grid grid-cols-3 gap-2">
                <div class="field">
                    <label for="ho_ten">Mã Sinh Viên</label>
                    <input id="ma_hoc_sinh" type="text" class="border rounded p-2 w-full" placeholder="22510500" />
                </div>
                <div class="field col-span-2">
                    <label for="ho_ten">Họ tên</label>
                    <input id="ho_ten" type="text" class="border rounded p-2 w-full" placeholder="Nhập họ tên" />
                </div>
                <div class="field col-span-2 ">
                    <label for="address1">Địa Chỉ</label>
                    <input id="address1" type="text" class="border rounded p-2 w-full" placeholder="Nhập địa chỉ" />
                </div>
                <div class="field">
                    <label for="birthdate">Ngày Sinh</label>
                    <input type="date" id="birthdate" class="border rounded p-2 w-full" />
                </div>
                <div class="field">
                    <label for="phone1">Số Điện Thoại</label>
                    <input id="phone1" type="text" class="border rounded p-2 w-full" placeholder="Nhập số điện thoại" />
                </div>
                <div class="field">
                    <label for="gender1">Giới Tính</label>
                    <select id="gender1" class="border rounded p-2 w-full">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>

                <div class="field">
                    <label for="email1">Email</label>
                    <input id="email1" type="text" class="border rounded p-2 w-full" placeholder="Nhập email" />
                </div>
            </div>
            <div class="mt-7 flex gap-2">
                <button id="addStudentBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Thêm Học Sinh</button>
                <button id="resetBtn" class="bg-gray-500 text-white px-4 py-2 rounded">Huỷ</button>
            </div>
        </div>
        <!-- Danh Sách Học Sinh -->
        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="font-bold text-gray-700 mb-4">Danh Sách Học Sinh</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full border border-gray-300 text-gray-700">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border px-4 py-2">MSSV</th>
                            <th class="border px-4 py-2">Họ và Tên</th>
                            <th class="border px-4 py-2">Giới Tính</th>
                            <th class="border px-4 py-2">Năm Sinh</th>
                            <th class="border px-4 py-2">Địa Chỉ</th>
                            <th class="border px-4 py-2">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody class="students-no-class" id="students-list">
                        <tr>
                            <td class="border px-4 py-2"></td>
                            <td class="border px-4 py-2"></td>
                            <td class="border px-4 py-2"></td>
                            <td class="border px-4 py-2"></td>
                            <td class="border px-4 py-2"></td>
                            <td class="border px-4 py-2">
                                <button class="add-to-class-btn bg-blue-500 text-white px-2 py-1 rounded"
                                    data-id="{{ student.id }}">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>



<script>
    // Thu thập dữ liệu từ các trường trong form
    studentsArray = {{ student | tojson }}
    console.log(studentsArray)
    arryAdd = []

    document.getElementById("addStudentBtn").addEventListener("click", () => {
        const studentData = {
            ma_hoc_sinh: document.getElementById("ma_hoc_sinh").value.trim(),
            ho_ten: document.getElementById("ho_ten").value.trim(),
            ngay_sinh: document.getElementById("birthdate").value,
            std: document.getElementById("phone1").value.trim(),
            gioi_tinh: document.getElementById("gender1").value,
            dia_chi: document.getElementById("address1").value.trim(),
            mail: document.getElementById("email1").value.trim()
        };
        
        //Xử lý một xíu giao diện
        const exists = studentsArray.some(student => student.ma_hoc_sinh === studentData.ma_hoc_sinh);
        if (!exists) {
            // Nếu chưa tồn tại, thêm học sinh vào mảng
            studentsArray.push(studentData);
        } else {
            for (let i = 0; i < studentsArray.length; i++) {
                if (studentsArray[i].ma_hoc_sinh == studentData.ma_hoc_sinh) {
                    console.log("studentsArray[i]", studentsArray[i])
                    studentsArray[i] = studentData
                }
            }
        }

        arryAdd.push(studentData);
        add_Student_database()
        // Log mảng học sinh để kiểm tra
        console.log(studentsArray);
        // Xử lý sau khi thêm học sinh (có thể hiển thị thông báo, hoặc làm gì đó khác)
        updateStudentList();
        alert("Học sinh đã được thêm vào danh sách.");
        document.getElementById('ma_hoc_sinh').value = '';
        document.getElementById('ho_ten').value = '';
        document.getElementById('birthdate').value = '';
        document.getElementById('phone1').value = '';
        document.getElementById('gender1').value = 'Nam'; // Đặt lại giá trị mặc định
        document.getElementById('address1').value = '';
        document.getElementById('email1').value = '';
        updateStudentList()
    });

    function add_Student_database() {

        const dataToSend = {
            key: "save_student",
            data: arryAdd
        };
        fetch('/api/add_Student', {
            method: "POST",
            body: JSON.stringify(dataToSend), // Truyền trực tiếp JSON
            headers: {
                'Content-Type': 'application/json' // Định nghĩa kiểu dữ liệu JSON
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                alert("Phản hồi từ server: " + JSON.stringify(data));
                // Xử lý kết quả trả về từ server (có thể reset mảng hoặc cập nhật giao diện)
                arryAdd = []; // Reset mảng sau khi lưu thành công
            })
            .catch(error => {
                console.error("Lỗi xảy ra:", error);
                alert("Có lỗi xảy ra khi gửi dữ liệu.");
            });

    }


    function updateStudentList() {
        const tbody = document.getElementById('students-list');
        tbody.innerHTML = ''; // Xóa tất cả các dòng hiện tại trong tbody

        studentsArray.forEach(student => {
            // Tạo một dòng mới cho mỗi học sinh
            const row = document.createElement('tr');

            // Tạo các ô dữ liệu trong dòng
            row.innerHTML = `
            <td class="border px-4 py-2">${student.ma_hoc_sinh}</td>
            <td class="border px-4 py-2">${student.ho_ten}</td>
            <td class="border px-4 py-2">${student.gioi_tinh}</td>
            <td class="border px-4 py-2">${student.ngay_sinh}</td>
            <td class="border px-4 py-2">${student.dia_chi}</td>
            <td class="border px-4 py-2">
                <div class="flex space-x-2">
                    <!-- Nút cây bút chì -->
                    <button class="edit-btn bg-blue-500 text-white px-2 py-1 rounded flex items-center justify-center"
                        data-id="${student.ma_hoc_sinh}">
                        <i class="fas fa-pencil-alt"></i>
                    </button>
                    <!-- Nút thùng rác -->
                    <button class="delete-btn bg-blue-500 text-white px-2 py-1 rounded flex items-center justify-center"
                        data-id="${student.ma_hoc_sinh}">
                        <i class="fas fa-trash text-red-500"></i>
                    </button>
                </div>
            </td>`;

            tbody.appendChild(row); // Thêm dòng vào bảng
        });
        const deleteButtons = document.querySelectorAll('.delete-btn');
        deleteButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                // Lấy giá trị data-id từ nút được click
                const studentId = button.getAttribute('data-id');
                removeStudent(studentId);
            });
        });

        const editButtons = document.querySelectorAll('.edit-btn');
        // Lặp qua từng nút và thêm sự kiện click
        editButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                const studentId = button.getAttribute('data-id');
                fillStudentForm(studentId); // Gọi hàm fillStudentForm thay vì alert hoặc remove
            });
        });

    }

    document.addEventListener('DOMContentLoaded', () => {
        const resetBtn = document.getElementById('resetBtn');
        resetBtn.addEventListener('click', () => {
            // Đặt tất cả các trường nhập liệu thành rỗng
            document.getElementById('ma_hoc_sinh').value = '';
            document.getElementById('ho_ten').value = '';
            document.getElementById('birthdate').value = '';
            document.getElementById('phone1').value = '';
            document.getElementById('gender1').value = 'Nam'; // Đặt lại giá trị mặc định
            document.getElementById('address1').value = '';
            document.getElementById('email1').value = '';
        });
    });


    // Hàm điền thông tin học sinh vào form
    function fillStudentForm(studentId) {
        studentsArray.forEach(student => {
            if (String(student.ma_hoc_sinh) === studentId) {
                document.getElementById('ma_hoc_sinh').value = student.ma_hoc_sinh;
                document.getElementById('ho_ten').value = student.ho_ten;
                document.getElementById('birthdate').value = student.ngay_sinh;
                document.getElementById('phone1').value = student.std;
                document.getElementById('gender1').value = student.gioi_tinh;
                document.getElementById('address1').value = student.dia_chi;
                document.getElementById('email1').value = student.mail;
            }
        });
    }

    // Hàm xóa học sinh
    function removeStudent(studentId) {
        // Thực hiện xóa học sinh theo studentId
        studentsArray = studentsArray.filter(student => String(student.ma_hoc_sinh) !== studentId);
        alert('Học sinh đã được xóa.');
    }

    const deleteButtons = document.querySelectorAll('.delete-btn');
    deleteButtons.forEach(button => {
        button.addEventListener('click', (event) => {
            // Lấy giá trị data-id từ nút được click
            const studentId = button.getAttribute('data-id');
            removeStudent(studentId);
        });
    });

    function removeStudent(studentId) {
        // Tìm học sinh trong mảng studentsArray dựa trên studentId
        const studentIndex = studentsArray.findIndex(student => String(student.ma_hoc_sinh) === studentId);
        if (studentIndex !== -1) {
            // Xóa học sinh khỏi mảng
            studentsArray.splice(studentIndex, 1);
            alert('Học sinh đã được xóa khỏi mảng.');
        }
        fetch('/api/remote_Student', {
            method: "POST",
            body: JSON.stringify({
                "key": "remote",
                "data": [
                    {
                        "ma_sinh_vien": studentId
                    }
                ]
            }), // Truyền trực tiếp JSON
            headers: {
                'Content-Type': 'application/json' // Định nghĩa kiểu dữ liệu JSON
            }
        })
        // Sau khi xóa, gọi hàm updateStudentList() để làm mới giao diện
        updateStudentList();
    }

    updateStudentList();

</script>
{% endblock %}
