{% extends 'layout/base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex flex-col items-center pt-[100px]">
    <h1 class="text-xl font-bold text-gray-700 mb-6">Nhập điểm học sinh</h1>
    <!-- Danh sách học sinh -->
    <!-- Form Nhập Điểm -->
    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-4xl">
        <div class="grid grid-cols-3 gap-4">
            <!-- Năm học -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Chọn năm học - Học Kỳ</label>
                <select id="academicYearSelect" class="academic-year-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Chọn năm học - Học Kỳ</option>
                    {%for hocky in hocky %}
                    <option value="{{hocky.id}}">{{hocky.nam_hoc}} - {{hocky.ten}}</option>
                    {%endfor%}

                </select>
            </div>
            <!-- Môn học -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Môn học:</label>
                <select id="monhoc" class="subject-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Chọn môn học</option>
                    {%for monhoc in monhoc %}
                    <option value="{{monhoc.ma_mon}}">{{monhoc.ten}}</option>
                    {%endfor%}
                </select>
            </div>

            <!-- Chọn lớp -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Lớp:</label>
                <select id="select_cls" class="class-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Chọn lớp</option>
                    {% for cls in class__ %}
                    <option value="{{cls.ma_lop}}">{{ cls.ten }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Cột Điểm 15P</label>
                <select id="columnSelector15p" class="class-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Số Cột</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Cột điểm 1 tiết</label>
                <select id="columnSelector1t" class="class-select w-full px-4 py-2 border rounded-lg">
                    <option value="">Số Cột</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
        </div>
        <!-- Số cột điểm -->
        <div class="mt-4 mx-auto">
            <button id="creat_table" class="creat_table bg-blue-500 text-white px-4 py-2 rounded-lg">Tạo Bảng Nhập
                Điểm</button>
        </div>
    </div>
    <!-- Danh sách học sinh -->
    <div class="mt-4 grid bg-white p-6">
        <h2 class="text-lg font-bold text-gray-700 mb-2">Danh Sách Học Sinh:</h2>
        <table class="min-w-full border border-gray-300">
            <thead class="bg-gray-100">
                <tr>
                    <th class="border px-4 py-2">MSSV</th>
                    <th class="border px-4 py-2">Họ và Tên</th>
                    <th class="border px-4 py-2">Điểm 15 phút</th>
                    <th class="border px-4 py-2">Điểm 1 tiết</th>
                    <th class="border px-4 py-2">Điểm Cuối Kỳ</th>
                </tr>
            </thead>
            <tbody class="student-table-body" id="clist_student">

            </tbody>
        </table>
        <div class="mt-4 mx-auto">
            <button id="saveButton" class="save-button bg-blue-500 text-white px-4 py-2 rounded-lg">Lưu điểm</button>
        </div>
    </div>
</div>

<script>

    //hàm fetch dữ liệu từ học sinh trong lớp đi ra

    const selectElement = document.getElementById('academicYearSelect');
    let selectedValue = ""; // Khai báo biến toàn cục

    selectElement.addEventListener('change', function () {
        selectedValue = this.value; // Cập nhật giá trị
    });

    const selectCls = document.getElementById('select_cls');
    const selectSubjeck = document.getElementById('monhoc');

    selectSubjeck.addEventListener('change', function () {
        const selectedValue_subjec = parseInt(selectSubjeck.value) || 0;

        alert('Giá trị đã chọn là: ' + selectedValue_subjec);


    })

    selectCls.addEventListener('change', function () {
        // Lấy giá trị đã chọn
        const selectedValue_class = parseInt(selectCls.value) || 0;
        fetch(`/api/get_hoc`, {
            method: 'POST',

            body: JSON.stringify({
                "lop_hoc_id": selectedValue_class
            }), // Truyền trực tiếp JSON
            headers: {
                'Content-Type': 'application/json',
            },
        }).then(response => {
            if (!response.ok) {
                throw new Error('Lỗi khi lấy dữ liệu từ server.');
            }
            return response.json();
        }).then(data => {
            data = data["data"]
            console.log("dataaaaaaa=====>",data)
        })

        
    });

    // Bạn có thể sử dụng selectedValue ở nơi khác sau khi người dùng chọn


    const createTableButton = document.getElementById('creat_table');
    createTableButton.addEventListener('click', () => {

        const selectCls = document.getElementById('select_cls');
        const selectedValue = parseInt(selectCls.value) || 0;

        const columnSelector15p = document.getElementById('columnSelector15p');
        const Value_15p = parseInt(columnSelector15p.value) || 0;

        const columnSelector1t = document.getElementById('columnSelector1t');
        const Value_1t = parseInt(columnSelector1t.value) || 0;

        // alert("Value_1t" + Value_1t)
        // alert("Value_15p" + Value_15p)
        // alert("selectedValue" + selectedValue)

        // Kiểm tra nếu giá trị không hợp lệ thì không gửi request
        if (!selectedValue) {
            alert("Vui Lòng Chọn Lớp")
            return;
        }
        // console.log(selectedValue);

        // Gửi yêu cầu fetch đến server
        fetch(`/api/get_students_in_class`, {
            method: 'POST',

            body: JSON.stringify({
                "malop": selectedValue
            }), // Truyền trực tiếp JSON
            headers: {
                'Content-Type': 'application/json',
            },
        }).then(response => {
            if (!response.ok) {
                throw new Error('Lỗi khi lấy dữ liệu từ server.');
            }
            return response.json();
        }).then(data => {

            // arryStudents = [...data["data"]];

            const tbody = document.getElementById('clist_student');
            tbody.innerHTML = ''; // Xóa tất cả các dòng hiện tại trong tbody

            data["data"].forEach(student => {
                // Tạo một dòng mới cho mỗi học sinh
                const row = document.createElement('tr');

                // Tạo cột để nhập điểm cho "15 phút"
                const inputContainer15p = document.createElement('td');
                inputContainer15p.className = 'inputContainer15p border px-4 py-2 ';
                // inputContainer15p.style.display = 'flex';
                // inputContainer15p.style.gap = '5px'

                // Số ô nhập liệu mặc định cho "15 phút"
                const numberOfInputs15p = Value_15p; // Bạn có thể điều chỉnh số lượng ô nhập ở đây
                for (let i = 0; i < numberOfInputs15p; i++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '1';
                    input.placeholder = 'Điểm';
                    input.className = `id:${student.ma_hoc_sinh} border rounded px-1 py-0.5 text-sm w-16`;
                    input.setAttribute('data-id', student.ma_hoc_sinh); // Gán data-id là mã học sinh
                    input.setAttribute('data-type', '1');
                    inputContainer15p.appendChild(input);
                }

                // Tạo cột để nhập điểm cho "1 tiết"
                const inputContainer1t = document.createElement('td');
                inputContainer1t.className = 'inputContainer1t border px-4 py-2';
                // inputContainer1t.style.display = 'flex';
                // inputContainer1t.style.gap = '5px'

                // Số ô nhập liệu mặc định cho "1 tiết"
                const numberOfInputs1t = Value_1t; // Bạn có thể điều chỉnh số lượng ô nhập ở đây
                for (let i = 0; i < numberOfInputs1t; i++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '1';
                    input.placeholder = 'Điểm';
                    input.className = `id:${student.ma_hoc_sinh} border rounded px-1 py-0.5 text-sm w-16`;
                    input.setAttribute('data-id', student.ma_hoc_sinh); // Gán data-id là mã học sinh
                    input.setAttribute('data-type', '2');
                    inputContainer1t.appendChild(input);
                }

                const inputCuoiky = document.createElement('td');
                inputCuoiky.className = 'inputContainer1t border px-4 py-2';
                // inputContainer1t.style.display = 'flex';
                // inputContainer1t.style.gap = '5px'

                // Bạn có thể điều chỉnh số lượng ô nhập ở đây
                for (let i = 0; i < 1; i++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '1';
                    input.placeholder = 'Điểm';
                    input.className = `id:${student.ma_hoc_sinh} border rounded px-1 py-0.5 text-sm w-16`;
                    input.setAttribute('data-id', student.ma_hoc_sinh); // Gán data-id là mã học sinh
                    input.setAttribute('data-type', '3');
                    inputCuoiky.appendChild(input);
                }



                // Thêm dữ liệu học sinh vào các cột khác
                row.innerHTML = `
            <td class="border px-4 py-2">${student.ma_hoc_sinh}</td>
            <td class="border px-4 py-2">${student.ho_ten}</td>
        `;

                // Thêm các ô nhập vào dòng
                row.appendChild(inputContainer15p);
                row.appendChild(inputContainer1t);
                row.appendChild(inputCuoiky);


                // Thêm dòng vào bảng
                tbody.appendChild(row);
            });
        })
    });

    function getStudentScores() {
        const inputs = document.querySelectorAll('input[data-id][data-type]');
        const groupedData = {};

        // Duyệt qua các thẻ input
        inputs.forEach(input => {
            const dataId = input.getAttribute('data-id');
            const dataType = input.getAttribute('data-type');
            const value = input.value || null;

            // Nếu chưa có nhóm cho dataId, khởi tạo
            if (!groupedData[dataId]) {
                groupedData[dataId] = {};
            }

            // Nếu chưa có mảng cho dataType, khởi tạo
            if (!groupedData[dataId][dataType]) {
                groupedData[dataId][dataType] = [];
            }

            // Thêm giá trị vào nhóm
            groupedData[dataId][dataType].push(value);

        });



        const dataToSend = {
            key: "save_diem",
            data: Object.values(groupedData),
            hoc_ky_id: selectedValue
        };
        fetch('/api/add_diem', {
            method: "POST",
            body: JSON.stringify(dataToSend), // Truyền trực tiếp JSON
            headers: {
                'Content-Type': 'application/json' // Định nghĩa kiểu dữ liệu JSON
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }
            return response.json();
        })
            .then(data => {
                alert("Phản hồi từ server: " + JSON.stringify(data));
                // Xử lý kết quả trả về từ server (có thể reset mảng hoặc cập nhật giao diện)
                arryAdd = []; // Reset mảng sau khi lưu thành công
            })
            .catch(error => {
                console.error("Lỗi xảy ra:", error);
                alert("Có lỗi xảy ra khi gửi dữ liệu.");
            });
        // console.log(groupedData);
    }

    const ButtonSave = document.getElementById('saveButton');
    ButtonSave.addEventListener('click', () => {
        getStudentScores()
    })











</script>

{% endblock %}
