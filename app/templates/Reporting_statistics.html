{% extends 'layout/base.html' %}
{% block content %}
<div class="container mx-auto p-6 bg-white rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-center text-gray-700 mb-6">Thống Kê Báo Cáo</h1>

    <div class="flex flex-wrap gap-4 justify-center mb-6">
        <select class="p-2 border border-gray-300 rounded-md">
            <option value="math">Môn Học: Toán</option>
            <option value="science">Khoa Học</option>
            <!-- Add more options as needed -->
        </select>

        <select class="p-2 border border-gray-300 rounded-md">
            <option value="1">Học Kỳ: 1</option>
            <option value="2">Học Kỳ: 2</option>
        </select>

        <select class="p-2 border border-gray-300 rounded-md">
            <option value="2024-2025">Năm Học: 2024-2025</option>
            <!-- Add more years as needed -->
        </select>
    </div>

    <div class="overflow-x-auto mb-6">
        <table class="w-full border-collapse border border-gray-300 text-center">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border border-gray-300 p-2">STT</th>
                    <th class="border border-gray-300 p-2">Lớp</th>
                    <th class="border border-gray-300 p-2">Sĩ Số</th>
                    <th class="border border-gray-300 p-2">Số Lượng Đạt</th>
                    <th class="border border-gray-300 p-2">Không Đạt</th>
                    <th class="border border-gray-300 p-2">Tỷ Lệ</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic data rows go here -->
            </tbody>
        </table>
    </div>

    <div class="w-full h-64 flex justify-center items-center bg-gray-50 border border-gray-300 rounded-md">
        <p class="text-gray-500">Biểu đồ sẽ hiển thị ở đây</p>
    </div>

    <button class="mt-6 px-6 py-2 bg-red-500 text-white font-semibold rounded-md hover:bg-red-600 mx-auto block">
        Xuất Biểu Đồ
    </button>
</div>
{% endblock %}
