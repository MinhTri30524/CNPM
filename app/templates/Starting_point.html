{% extends 'layout/base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex flex-col items-center pt-[100px]">
    <!-- Phần tiêu đề -->
    <h1 class="text-xl font-bold text-gray-700 mb-6">
        Xuất Điểm Trung Bình Lớp
    </h1>

    <!-- Khung thông tin chính -->
    <div class="grid grid-cols-2 gap-4">
        <!-- Form Xuất Điểm Trung Bình -->
        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="font-bold text-gray-700 mb-4">Xuất Điểm Trung Bình Lớp</h2>
            <div class="grid grid-cols-2 gap-4">
                <!-- Chọn Năm Học -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Năm học:</label>
                    <select
                        class="academic-year-select w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Chọn năm học</option>
                        <option value="2022-2023">2022-2023</option>
                        <option value="2021-2022">2021-2022</option>
                        <option value="2020-2021">2020-2021</option>
                    </select>
                </div>

                <!-- Nhập Lớp -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Lớp:</label>
                    <input type="text" placeholder="10A"
                        class="class-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                </div>
            </div>
            <!-- Nhập Tên Học Sinh -->
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Tên học sinh:</label>
                <input type="text" placeholder="Nguyễn Văn A"
                    class="student-name-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>
            <!-- Nút Tìm học sinh -->
            <div class="col-span-2 flex justify-end">
                <button onclick="handleSearchStudent()"
                    class="export-btn bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Tìm học sinh
                </button>
            </div>
        </div>

        <!-- Bảng Điểm Trung Bình Lớp -->
        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="font-bold text-gray-700 mb-4">Bảng Điểm Trung Bình Lớp</h2>
            <table class="min-w-full border border-gray-300 text-gray-700 mb-4">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border px-4 py-2">STT</th>
                        <th class="border px-4 py-2">Họ tên</th>
                        <th class="border px-4 py-2">Lớp</th>
                        <th class="border px-4 py-2">Điểm TB HK1</th>
                        <th class="border px-4 py-2">Điểm TB HK2</th>
                    </tr>
                </thead>
                <tbody class="score-table-body">
                    <!-- Kết quả sẽ được thêm vào đây -->
                </tbody>
            </table>

            <!-- Nút Xuất -->
            <div class="col-span-2 flex justify-end">
                <button
                    class="export-btn bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Xuất
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
